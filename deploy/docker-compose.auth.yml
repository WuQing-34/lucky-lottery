# 可选加固：在应用前面加一层 nginx + Basic Auth，保护管理端
# 前提：先把 docker-compose.yml 里的 "8744:8000" 改成 "127.0.0.1:8744:8000"（只对本机暴露）
# 启用：sudo docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lottery-nginx
    restart: unless-stopped
    ports:
      - "8744:80"                     # 公网入口换成 nginx，再转发给 web
    volumes:
      - ./nginx/lottery.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - web

# 幸运大转盘 —— nginx 反代（可选加固）
# 设计：用户端放行（参与者要能直接打开链接），只给管理端加 Basic Auth。
# 上游用 compose 里的服务名 web。
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # 探活免鉴权，方便外部监控 / curl 验证
    location = /health {
        auth_basic off;
        proxy_pass http://web:8000;
    }

    # 管理端页面 + 管理接口：Basic Auth 兜底（即使忘了改 admin888 也不至于裸奔）
    location /admin {
        auth_basic           "lottery admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8000;
    }
    location /api/admin/ {
        auth_basic           "lottery admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8000;
    }

    # 用户端（登录/转盘/收货信息/区划数据）：完全放行
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8000;
    }
}
